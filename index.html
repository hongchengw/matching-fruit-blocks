<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farmer's Match</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!--
      The five stall regions from SPEC.md §3.3, in order. Later tasks fill them:
      12 dresses the chrome, 13 builds the grid, 17 the scoreboard, 21 the reset
      button. The data-region hooks are the stable contract between those tasks,
      so renaming one is a breaking change across several.
    -->
    <div class="stall">
      <div class="stall__awning" data-region="awning"></div>

      <header class="stall__signboard bevel" data-region="signboard">
        <h1 class="signboard__title">Farmer's Match</h1>
        <button
          class="signboard__mute bevel"
          data-control="mute"
          type="button"
          aria-pressed="false"
          aria-label="Mute sound"
        >
          Sound
        </button>
      </header>

      <div class="stall__scoreboard bevel" data-region="scoreboard"></div>

      <!--
        36 cards, 6x6 (SPEC.md 2.1). Static markup keeps this task purely
        declarative; task 16 takes over rendering from the shuffled deck.
      -->
      <main class="stall__grid" data-region="grid">
        <button class="card" data-card="0" data-state="down" type="button" aria-label="Card 1"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="1" data-state="down" type="button" aria-label="Card 2"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="2" data-state="down" type="button" aria-label="Card 3"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="3" data-state="down" type="button" aria-label="Card 4"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="4" data-state="down" type="button" aria-label="Card 5"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="5" data-state="down" type="button" aria-label="Card 6"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="6" data-state="down" type="button" aria-label="Card 7"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="7" data-state="down" type="button" aria-label="Card 8"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="8" data-state="down" type="button" aria-label="Card 9"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="9" data-state="down" type="button" aria-label="Card 10"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="10" data-state="down" type="button" aria-label="Card 11"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="11" data-state="down" type="button" aria-label="Card 12"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="12" data-state="down" type="button" aria-label="Card 13"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="13" data-state="down" type="button" aria-label="Card 14"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="14" data-state="down" type="button" aria-label="Card 15"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="15" data-state="down" type="button" aria-label="Card 16"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="16" data-state="down" type="button" aria-label="Card 17"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="17" data-state="down" type="button" aria-label="Card 18"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="18" data-state="down" type="button" aria-label="Card 19"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="19" data-state="down" type="button" aria-label="Card 20"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="20" data-state="down" type="button" aria-label="Card 21"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="21" data-state="down" type="button" aria-label="Card 22"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="22" data-state="down" type="button" aria-label="Card 23"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="23" data-state="down" type="button" aria-label="Card 24"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="24" data-state="down" type="button" aria-label="Card 25"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="25" data-state="down" type="button" aria-label="Card 26"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="26" data-state="down" type="button" aria-label="Card 27"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="27" data-state="down" type="button" aria-label="Card 28"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="28" data-state="down" type="button" aria-label="Card 29"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="29" data-state="down" type="button" aria-label="Card 30"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="30" data-state="down" type="button" aria-label="Card 31"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="31" data-state="down" type="button" aria-label="Card 32"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="32" data-state="down" type="button" aria-label="Card 33"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="33" data-state="down" type="button" aria-label="Card 34"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="34" data-state="down" type="button" aria-label="Card 35"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
        <button class="card" data-card="35" data-state="down" type="button" aria-label="Card 36"><span class="card__inner"><span class="card__face card__face--back bevel"><canvas class="card__art" width="16" height="16"></canvas></span><span class="card__face card__face--front bevel"><canvas class="card__art" width="16" height="16"></canvas></span></span></button>
      </main>

      <footer class="stall__base bevel" data-region="base">
        <span class="price-tag">2 for 1</span>
        <button class="reset-button bevel" data-control="reset" type="button">Reset</button>
        <span class="price-tag">Fresh</span>
      </footer>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
